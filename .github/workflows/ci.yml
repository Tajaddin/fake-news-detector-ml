name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install baseline deps (sklearn stack, no torch)
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn scipy requests rich nltk joblib pytest
      - name: Unit tests
        run: pytest test_features.py -q
      - name: Download + split LIAR
        run: |
          python download_data.py --dataset liar
          python src/data_io.py --dataset liar --format csv
      - name: Held-out evaluation (reproduces the reported metric)
        run: python src/eval_holdout.py
