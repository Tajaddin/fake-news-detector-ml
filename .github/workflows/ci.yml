name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-baseline.txt
      - name: Install baseline deps (sklearn stack, no torch; pinned with hashes)
        run: pip install --require-hashes -r requirements-baseline.txt
      - name: Download + split LIAR
        run: |
          python download_data.py --dataset liar
          python src/data_io.py --dataset liar --format csv
      - name: Tests (unit tests plus the held-out metric regression check)
        run: pytest -q
      - name: Held-out evaluation (reproduces the reported metric)
        run: python src/eval_holdout.py
